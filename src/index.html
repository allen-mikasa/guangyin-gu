<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; img-src 'self' data:;" />
  <title>光阴蛊</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="water-layer" aria-hidden="true"></div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-seal">蛊</span>
      <div class="brand-text">
        <h1>光阴蛊</h1>
        <span class="brand-sub">光阴滚滚，寸阴是竞</span>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-page="timer">刻漏</button>
      <button class="tab" data-page="river">长河</button>
      <button class="tab" data-page="scroll">卷宗</button>
      <button class="tab" data-page="past" title="自选事项，细算过往">极往</button>
    </nav>
    <div class="topbar-right">
      <button id="btn-pip" class="btn-pip" title="小窗置顶显示">浮窗置顶</button>
      <button id="btn-settings" class="btn-pip btn-settings" title="设置">设置</button>
      <div class="clock">
        <span id="now-time">--:--:--</span>
        <span id="now-date">----</span>
      </div>
    </div>
  </header>

  <!-- 浮窗模式迷你顶栏 -->
  <div class="pip-bar" id="pip-bar" hidden>
    <span class="pip-seal">蛊</span>
    <span class="pip-title" id="pip-title">光阴蛊</span>
    <button id="btn-cap" class="pip-cap" title="缩为胶囊 / 展开主窗，窗口隐藏后也可由托盘图标或 Ctrl+Alt+G 召回" hidden>◫</button>
    <button id="btn-pip-exit" class="pip-exit" title="退出浮窗，恢复主窗">✕</button>
  </div>

  <main>
    <!-- ========== 计时页 ========== -->
    <section class="page active" id="page-timer">
      <aside class="panel scene-panel">
        <h2 class="panel-title"><span class="deco">◆</span> 光阴长河 · 修习</h2>
        <div class="module-grid" id="study-grid"></div>
        <h2 class="panel-title second"><span class="deco">◆</span> 凡尘诸事</h2>
        <div class="module-grid life" id="life-grid"></div>
      </aside>

      <section class="panel timer-panel">
        <div class="mode-switch" id="mode-switch">
          <button data-mode="stopwatch" class="active">正计时</button>
          <button data-mode="countdown">倒计时</button>
          <button data-mode="focus">专注</button>
        </div>

        <div class="dial-wrap">
          <svg class="dial" viewBox="0 0 320 320">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#e8c98a" />
                <stop offset="55%" stop-color="#c9a15e" />
                <stop offset="100%" stop-color="#7fa89a" />
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="160" cy="160" r="140" />
            <circle class="ring-fg" id="ring-fg" cx="160" cy="160" r="140" />
          </svg>
          <div class="dial-center">
            <div class="dial-module" id="dial-module">未择科目</div>
            <div class="dial-time" id="dial-time">00:00</div>
            <div class="dial-sub" id="dial-sub">选择模块，即刻启程</div>
          </div>
        </div>

        <!-- 倒计时设置 -->
        <div class="cfg" id="cfg-countdown" hidden>
          <div class="quick-times" id="quick-times"></div>
          <div class="custom-time">
            <label>自定：</label>
            <input type="number" id="cd-min" min="1" max="600" value="25" /> 分
            <input type="number" id="cd-sec" min="0" max="59" value="0" /> 秒
          </div>
        </div>

        <!-- 专注设置 -->
        <div class="cfg" id="cfg-focus" hidden>
          <div class="focus-cfg">
            <label>专注 <input type="number" id="fk-focus" min="1" max="180" value="25" /> 分</label>
            <label>短休 <input type="number" id="fk-short" min="1" max="60" value="5" /> 分</label>
            <label>长休 <input type="number" id="fk-long" min="1" max="60" value="15" /> 分</label>
            <label>几轮长休 <input type="number" id="fk-cycle" min="2" max="12" value="4" /> 轮</label>
          </div>
        </div>

        <div class="controls">
          <button id="btn-start" class="btn-primary">开 始</button>
          <button id="btn-pause" class="btn-warn" hidden>暂 停</button>
          <button id="btn-resume" class="btn-primary" hidden>继 续</button>
          <button id="btn-stop" class="btn-ghost" hidden>结 束</button>
        </div>
        <div class="tip" id="timer-tip"></div>
      </section>

      <aside class="panel side-panel">
        <h2 class="panel-title"><span class="deco">◆</span> 声境</h2>
        <div class="sound-list" id="sound-list"></div>
        <div class="master-vol">
          <span>总音量</span>
          <input type="range" id="master-vol" min="0" max="100" value="60" />
        </div>

        <h2 class="panel-title second"><span class="deco">◆</span> 今日光阴</h2>
        <div class="today-box">
          <div class="today-total" id="today-total">0 分钟</div>
          <div class="today-sub" id="today-sub">修习 0 · 诸事 0</div>
          <div class="today-bars" id="today-bars"></div>
        </div>
      </aside>
    </section>

    <!-- ========== 长河页 ========== -->
    <section class="page" id="page-river">
      <div class="river-toolbar">
        <div class="filter-group" id="river-range">
          <button data-range="day" class="active">日</button>
          <button data-range="week">周</button>
          <button data-range="month">月</button>
          <button data-range="year">年</button>
          <button data-range="total">总计</button>
        </div>
        <div class="river-cursor">
          <button id="river-prev" class="btn-small">‹</button>
          <span id="river-cursor-label">今日</span>
          <button id="river-next" class="btn-small">›</button>
          <button id="river-today" class="btn-small">回到此刻</button>
          <span class="river-hint" id="river-hint"></span>
        </div>
      </div>
      <div class="stat-cards" id="stat-cards"></div>

      <div class="panel river-panel">
        <h2 class="panel-title" id="river-title"><span class="deco">◆</span> 光阴长河 · 今日时辰</h2>
        <div class="river-chart" id="river-chart"></div>
        <div class="river-x" id="river-x"></div>
        <div class="river-legend">
          <span>少</span>
          <div class="legend-cells"></div>
          <span>多</span>
          <span class="river-unit" id="river-unit"></span>
        </div>
      </div>

      <div class="river-bottom">
        <div class="panel module-rank-panel">
          <h2 class="panel-title"><span class="deco">◆</span> 各科修习分布</h2>
          <div id="module-rank"></div>
        </div>
        <div class="panel heat-panel">
          <h2 class="panel-title"><span class="deco">◆</span> 长河星图 · 近二十周</h2>
          <div class="heat-wrap">
            <div class="heat-labels">
              <span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span>
            </div>
            <div class="heat-scroll"><div class="heatmap" id="heatmap"></div></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ========== 卷宗页 ========== -->
    <section class="page" id="page-scroll">
      <div class="panel scroll-panel">
        <div class="scroll-toolbar">
          <div class="filter-group" id="record-filter">
            <button data-filter="all" class="active">全部</button>
            <button data-filter="study">修习</button>
            <button data-filter="life">诸事</button>
          </div>
          <div class="scroll-search">
            <input type="search" id="record-search" class="search-input" placeholder="搜索事项名称…" autocomplete="off" />
            <button id="record-search-clear" class="search-clear" title="清空搜索" hidden>✕</button>
          </div>
          <div class="toolbar-right">
            <span class="search-count" id="record-count"></span>
            <button id="btn-export-csv" class="btn-small">导出 CSV</button>
            <button id="btn-clear" class="btn-small danger">清空卷宗</button>
          </div>
        </div>
        <div class="record-head">
          <span class="col-date">日期</span>
          <span class="col-range">时辰</span>
          <span class="col-module">科目 / 事项</span>
          <span class="col-mode">模式</span>
          <span class="col-dur">时长</span>
          <span class="col-status">状态</span>
          <span class="col-op"></span>
        </div>
        <div class="record-list" id="record-list"></div>
        <div class="empty-tip" id="record-empty" hidden>卷宗空空，光阴未落笔。</div>
        <div class="empty-tip search-empty" id="record-no-match" hidden>没有匹配的事项，换个词试试。</div>
      </div>
    </section>

    <!-- ========== 极往页 ========== -->
    <section class="page" id="page-past">
      <div class="past-toolbar">
        <div class="past-picks">
          <button id="past-pick-all" class="btn-small">全选</button>
          <button id="past-pick-none" class="btn-small">清空</button>
          <button id="past-pick-study" class="btn-small">只选修习</button>
          <button id="past-pick-life" class="btn-small">只选诸事</button>
        </div>
        <div class="past-range filter-group" id="past-range">
          <button data-range="week">近七日</button>
          <button data-range="month">近三十日</button>
          <button data-range="year">近一年</button>
          <button data-range="total" class="active">全部</button>
        </div>
      </div>

      <div class="past-picker panel">
        <h2 class="panel-title"><span class="deco">◆</span> 择其所往</h2>
        <div class="past-group">
          <div class="past-group-title">修习</div>
          <div class="past-chips" id="past-study-chips"></div>
        </div>
        <div class="past-group">
          <div class="past-group-title">凡尘诸事</div>
          <div class="past-chips" id="past-life-chips"></div>
        </div>
      </div>

      <div class="past-cards" id="past-cards"></div>

      <div class="past-bottom">
        <div class="panel past-trend-panel">
          <h2 class="panel-title" id="past-trend-title"><span class="deco">◆</span> 岁月走势</h2>
          <div class="past-chart" id="past-chart"></div>
          <div class="past-x" id="past-x"></div>
        </div>
        <div class="panel past-share-panel">
          <h2 class="panel-title"><span class="deco">◆</span> 所占份额</h2>
          <div id="past-share"></div>
          <div class="past-note" id="past-note"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 设置 -->
  <div class="modal-mask" id="settings-mask" hidden>
    <div class="modal settings-modal">
      <h3>设 置</h3>
      <div class="settings-list">
        <label class="set-row">
          <span class="set-text">计时结束后自动隐藏窗口<em>浮窗置顶状态下，结束计时 4 秒后隐藏；可由托盘图标或 Ctrl+Alt+G 召回</em></span>
          <input type="checkbox" id="set-autohide" class="set-switch" />
        </label>
        <label class="set-row">
          <span class="set-text">计时中自动缩为胶囊<em>浮窗置顶时，开始计时即缩成屏幕角落的小条</em></span>
          <input type="checkbox" id="set-autocap" class="set-switch" />
        </label>
        <label class="set-row">
          <span class="set-text">光圈随进度变色<em>翠绿起步，每五分之一依次转为赤红、银白、金黄、亮紫；关闭则恢复原有金玉渐变与休息青玉</em></span>
          <input type="checkbox" id="set-ringflow" class="set-switch" />
        </label>
        <label class="set-row">
          <span class="set-text">窗口始终置顶<em>重启后依然保持置顶</em></span>
          <input type="checkbox" id="set-pinned" class="set-switch" />
        </label>
      </div>
      <div class="modal-ops">
        <button id="settings-close" class="btn-small">完 成</button>
      </div>
    </div>
  </div>

  <!-- 改名（可同时改归属：修习 / 诸事） -->
  <div class="modal-mask" id="rename-mask" hidden>
    <div class="modal rename-modal">
      <h3>更改事项</h3>
      <label class="rename-field">
        <span>名称</span>
        <input type="text" id="rename-input" class="modal-input" maxlength="12" placeholder="输入新的名称" />
      </label>
      <div class="rename-field">
        <span>归为</span>
        <div class="seg-pick" id="rename-scene">
          <button type="button" data-scene="study">修习</button>
          <button type="button" data-scene="life">诸事</button>
        </div>
      </div>
      <p class="rename-hint" id="rename-hint"></p>
      <div class="modal-ops">
        <button id="rename-cancel" class="btn-small">取消</button>
        <button id="rename-ok" class="btn-small do">保存</button>
      </div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div class="modal-mask" id="modal-mask" hidden>
    <div class="modal">
      <h3 id="modal-title">确认</h3>
      <p id="modal-body"></p>
      <div class="modal-ops">
        <button id="modal-cancel" class="btn-small">取消</button>
        <button id="modal-ok" class="btn-small danger">确认</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="audio.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
